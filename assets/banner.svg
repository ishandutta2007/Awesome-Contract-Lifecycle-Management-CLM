<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="45" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .orb-anim1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-anim2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .card-float1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-float2 { animation: floatCard2 7s ease-in-out infinite; }
    .flowing-line { stroke-dasharray: 8 6; animation: dashMove 2.5s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs (Non-obstructing, positioned in deep background) -->
  <g opacity="0.4">
    <circle class="orb-anim1" cx="180" cy="90" r="140" fill="#3b82f6" filter="url(#glowBlue)" />
    <circle class="orb-anim2" cx="1020" cy="330" r="160" fill="#8b5cf6" filter="url(#glowPurple)" />
    <circle cx="600" cy="420" r="180" fill="#06b6d4" opacity="0.2" filter="url(#glowBlue)" />
  </g>

  <!-- Background Decorative Flow Lines -->
  <path class="flowing-line" d="M 50 350 Q 300 380 600 350 T 1150 350" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" />
  <path class="flowing-line" d="M 100 80 Q 400 30 700 70 T 1100 60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Background Accent Architecture Badges (Cards floating safely behind text) -->
  <g class="card-float1" opacity="0.45">
    <rect x="60" y="45" width="210" height="48" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" filter="url(#cardShadow)" />
    <text x="165" y="75" fill="#93c5fd" font-size="13" font-weight="600" text-anchor="middle">⚡ AI Clause Intelligence</text>
  </g>

  <g class="card-float2" opacity="0.45">
    <rect x="930" y="55" width="210" height="48" rx="24" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1" filter="url(#cardShadow)" />
    <text x="1035" y="85" fill="#d8b4fe" font-size="13" font-weight="600" text-anchor="middle">🔒 Self-Hosted Sovereignty</text>
  </g>

  <!-- Foreground Title and Core Content (Unobstructed & Perfectly Centered) -->
  <g text-anchor="middle">
    <!-- Super Title / Category Tag -->
    <rect x="440" y="50" width="320" height="32" rx="16" fill="#1e293b" fill-opacity="0.85" stroke="#3b82f6" stroke-width="1" />
    <text x="600" y="71" fill="#60a5fa" font-size="12" font-weight="700" letter-spacing="1.5">AWESOME LEGALTECH DIRECTORY</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#primaryTextGrad)" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome CLM Platform Guide</text>

    <!-- Subtitle -->
    <text x="600" y="195" fill="#f8fafc" font-size="20" font-weight="600">Contract Lifecycle Management &amp; Legal Operations Ecosystem</text>

    <!-- Explanatory Tagline -->
    <text x="600" y="235" fill="#94a3b8" font-size="14" font-weight="400">Curated SaaS Market Leaders • Open-Source Repositories • Obligation Intelligence • Audit Workflows</text>
  </g>

  <!-- Interactive/Dynamic Feature Status Pills (Bottom Tier) -->
  <g transform="translate(180, 280)">
    <!-- Pill 1: Enterprise CLM -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="21" r="5" fill="#3b82f6" />
      <text x="100" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🏢 Enterprise CLM</text>
    </g>

    <!-- Pill 2: Open-Source First -->
    <g transform="translate(210, 0)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="21" r="5" fill="#10b981" />
      <text x="105" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🌐 Open-Source CLM</text>
    </g>

    <!-- Pill 3: E-Signature &amp; Workflows -->
    <g transform="translate(430, 0)">
      <rect width="210" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="21" r="5" fill="#8b5cf6" />
      <text x="115" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">✍️ Digital Signatures</text>
    </g>

    <!-- Pill 4: AI &amp; Obligation Extraction -->
    <g transform="translate(670, 0)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="25" cy="21" r="5" fill="#ec4899" />
      <text x="95" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🔍 AI Extraction</text>
    </g>
  </g>

  <!-- Bottom Accent Highlights -->
  <line x1="250" y1="365" x2="950" y2="365" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
  <circle cx="600" cy="365" r="3" fill="#60a5fa" />
</svg>